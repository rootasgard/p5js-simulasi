<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1680" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="24" width="840" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">DIAGRAM ALIR SISTEM SIMULASI KESELAMATAN PENGEREMAN KENDARAAN</text>
  <text x="450" y="72" text-anchor="middle" font-size="12" fill="#64748b">Fisika Komputasi GLBB • Metode Euler-Cromer • Syarat Batas Barikade &amp; Jalan Berlubang</text>

  <!-- Node 1: Start Terminal -->
  <g filter="url(#shadow)">
    <rect x="340" y="110" width="220" height="44" rx="22" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <text x="450" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Mulai Program Simulasi</text>
  </g>
  <line x1="450" y1="154" x2="450" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: Environment Init -->
  <g filter="url(#shadow)">
    <rect x="180" y="186" width="540" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="450" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Inisialisasi Lingkungan 3D WebGL (Metropolis &amp; Lintasan Panjang)</text>
    <text x="450" y="234" text-anchor="middle" font-size="11.5" fill="#475569">Jalan Raya 5400 px, Lampu PJU, Posisi Awal Mobil x = -900 px, Barikade x = +320 px (Lintasan 1220 px), Potholes x &gt; 200 px</text>
  </g>
  <line x1="450" y1="250" x2="450" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: Theme & Vehicle Selection -->
  <g filter="url(#shadow)">
    <rect x="210" y="282" width="480" height="58" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="450" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">Pilihan Mode Tampilan &amp; Model Kendaraan</text>
    <text x="450" y="326" text-anchor="middle" font-size="11.5" fill="#0284c7">Toggle Tema: Siang (Light) / Malam (Dark) • Model: Mobil Kota, Sedan Hujan, Sport, Truk</text>
  </g>
  <line x1="450" y1="340" x2="450" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4: Input Parameters (Parallelogram) -->
  <g filter="url(#shadow)">
    <polygon points="210,372 710,372 670,436 170,436" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="440" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">Input Parameter Pengereman &amp; Mitigasi</text>
    <text x="440" y="418" text-anchor="middle" font-size="11.5" fill="#0284c7">Laju awal v₀ (km/jam), massa m (kg), koefisien gesek μ, jarak barikade d (m), waktu redam Δt_airbag (s)</text>
  </g>
  <line x1="440" y1="436" x2="440" y2="468" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 5: Pre-compute GLBB -->
  <g filter="url(#shadow)">
    <rect x="220" y="468" width="440" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="440" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Pra-Hitung Metrik GLBB Analitik (Eksak)</text>
    <text x="440" y="512" text-anchor="middle" font-size="11.5" fill="#334155">Konversi v₀ = v₀(km/j)/3.6 (m/s) • Perlambatan |a| = μ·g (g = 9.80665 m/s²)</text>
    <text x="440" y="530" text-anchor="middle" font-size="11.5" fill="#334155">Waktu henti t_henti = v₀ / (μ·g) • Jarak henti s_henti = v₀² / (2·μ·g)</text>
  </g>
  <line x1="440" y1="542" x2="440" y2="574" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 6: State Init -->
  <g filter="url(#shadow)">
    <rect x="260" y="574" width="360" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="440" y="595" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Inisialisasi Variabel Status Dinamis</text>
    <text x="440" y="612" text-anchor="middle" font-size="11" fill="#475569">t_gerak = 0 s, x = 0 m, v = v₀ m/s, simState = 'running'</text>
  </g>
  <line x1="440" y1="622" x2="440" y2="654" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 7: Real-time Frame Loop (Loop Header) -->
  <g filter="url(#shadow)">
    <rect x="230" y="654" width="420" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="440" y="676" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Loop Frame Waktu-Nyata (p5.js draw() @ 60 FPS)</text>
    <text x="440" y="696" text-anchor="middle" font-size="11.5" fill="#b45309">Hitung Δt = min(deltaTime/1000, 0.033 s) • Akumulasi t_gerak += Δt</text>
  </g>
  <line x1="440" y1="708" x2="440" y2="740" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 8: Euler-Cromer Integration Step -->
  <g filter="url(#shadow)">
    <rect x="200" y="740" width="480" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="440" y="764" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Integrasi Numerik Metode Euler-Cromer (Semi-Implisit)</text>
    <text x="440" y="784" text-anchor="middle" font-size="12" fill="#047857">1. Kecepatan: vₙ₊₁ = max(0, vₙ - μ·g·Δt)   [Syarat Batas v ≥ 0]</text>
    <text x="440" y="800" text-anchor="middle" font-size="12" fill="#047857">2. Posisi: xₙ₊₁ = xₙ + vₙ₊₁·Δt   [Metode Euler-Cromer]</text>
  </g>
  <line x1="440" y1="806" x2="440" y2="838" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 9: Visual & Telemetry Update -->
  <g filter="url(#shadow)">
    <rect x="220" y="838" width="440" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="440" y="860" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Pembaruan Visual 3D &amp; Telemetri HUD</text>
    <text x="440" y="878" text-anchor="middle" font-size="11" fill="#475569">x_world = -900 + (x/d)·1220 px • Rotasi Roda • Jejak Ban (Skid Marks) • HUD (v, x, t)</text>
  </g>
  <line x1="440" y1="890" x2="440" y2="926" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 10: DECISION 1 - Collision Check (Diamond) -->
  <g filter="url(#shadow)">
    <polygon points="440,926 620,980 440,1034 260,980" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="440" y="974" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Apakah Mobil Menabrak Barikade?</text>
    <text x="440" y="992" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">(xₙ₊₁ ≥ d)</text>
  </g>

  <!-- Branch: YA (Crash - Left) -->
  <line x1="260" y1="980" x2="160" y2="980" stroke="#dc2626" stroke-width="2"/>
  <line x1="160" y1="980" x2="160" y2="1056" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="210" y="972" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Ya (s &gt; d)</text>

  <!-- Crash Branch Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="1056" width="280" height="154" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.8"/>
    <text x="180" y="1080" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Syarat Batas Benturan Aktif</text>
    <text x="180" y="1102" text-anchor="middle" font-size="11.5" fill="#7f1d1d">1. Jepit koordinat: x_kontak = d</text>
    <text x="180" y="1120" text-anchor="middle" font-size="11.5" fill="#7f1d1d">2. Laju benturan: v_benturan = vₙ₊₁</text>
    <text x="180" y="1138" text-anchor="middle" font-size="11.5" fill="#7f1d1d">3. Kamera bergetar &amp; barikade miring</text>
    <text x="180" y="1156" text-anchor="middle" font-size="11.5" fill="#7f1d1d">4. Balon Airbag mengembang r(t)</text>
    <text x="180" y="1174" text-anchor="middle" font-size="11.5" fill="#7f1d1d">5. Hitung F_peak = (π/2)·(m·v_benturan / Δt_airbag)</text>
    <text x="180" y="1192" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">Mencegah jatuh ke jalan berlubang!</text>
  </g>

  <!-- Branch: TIDAK (Check Safe Stop - Straight Down) -->
  <line x1="440" y1="1034" x2="440" y2="1090" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="1058" font-size="12" font-weight="600" fill="#475569">Tidak</text>

  <!-- Node 11: DECISION 2 - Safe Stop Check (Diamond) -->
  <g filter="url(#shadow)">
    <polygon points="440,1090 620,1144 440,1198 260,1144" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="440" y="1138" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Apakah Mobil Berhenti Selamat?</text>
    <text x="440" y="1156" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">(vₙ₊₁ ≤ 0.01 m/s)</text>
  </g>

  <!-- Branch Stop: YA (Safe Stop - Right) -->
  <line x1="620" y1="1144" x2="720" y2="1144" stroke="#059669" stroke-width="2"/>
  <line x1="720" y1="1144" x2="720" y2="1220" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="670" y="1136" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">Ya (s ≤ d)</text>

  <!-- Safe Stop Branch Box -->
  <g filter="url(#shadow)">
    <rect x="580" y="1220" width="280" height="114" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8"/>
    <text x="720" y="1246" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Syarat Batas Berhenti Aman</text>
    <text x="720" y="1270" text-anchor="middle" font-size="11.5" fill="#14532d">1. Kunci kecepatan: v = 0 m/s</text>
    <text x="720" y="1288" text-anchor="middle" font-size="11.5" fill="#14532d">2. Sisa jarak aman: Δx = d - x_akhir</text>
    <text x="720" y="1306" text-anchor="middle" font-size="11.5" fill="#14532d">3. simState = 'safe' (Banner Hijau)</text>
    <text x="720" y="1324" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">Mobil aman dari barikade &amp; lubang</text>
  </g>

  <!-- Branch Stop: TIDAK (Continue Loop - Loopback to 60 FPS) -->
  <line x1="440" y1="1198" x2="440" y2="1240" stroke="#475569" stroke-width="2"/>
  <line x1="440" y1="1240" x2="350" y2="1240" stroke="#475569" stroke-width="2"/>
  <line x1="350" y1="1240" x2="350" y2="681" stroke="#475569" stroke-width="2"/>
  <line x1="350" y1="681" x2="230" y2="681" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="1225" font-size="11" fill="#64748b">Masih meluncur (loop ke frame berikutnya)</text>

  <!-- Crash and Safe Convergence -->
  <line x1="180" y1="1210" x2="180" y2="1360" stroke="#475569" stroke-width="2"/>
  <line x1="720" y1="1334" x2="720" y2="1360" stroke="#475569" stroke-width="2"/>
  <line x1="180" y1="1360" x2="720" y2="1360" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="1360" x2="450" y2="1394" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 12: Reporting & Telemetry Table -->
  <g filter="url(#shadow)">
    <rect x="190" y="1394" width="520" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="450" y="1418" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Pencatatan Hasil &amp; Plotting Kurva Impuls</text>
    <text x="450" y="1440" text-anchor="middle" font-size="11.5" fill="#334155">1. Catat ke Tabel Percobaan: No, v₀, μ, m, d, Δt, t_gerak, s_henti, v_benturan, Status</text>
    <text x="450" y="1458" text-anchor="middle" font-size="11.5" fill="#334155">2. Render Kurva Gaya Impuls F(t) dinamis di Modal Hasil</text>
  </g>
  <line x1="450" y1="1474" x2="450" y2="1516" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 13: End Terminal -->
  <g filter="url(#shadow)">
    <rect x="330" y="1516" width="240" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="450" y="1545" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Selesai / Siap Uji Coba Baru</text>
  </g>
</svg>