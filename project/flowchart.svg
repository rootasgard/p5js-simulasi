<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="30" y="16" width="700" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="38" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">DIAGRAM ALIR SIMULASI PENGEREMAN KENDARAAN (EULER-CROMER)</text>
  <text x="380" y="54" text-anchor="middle" font-size="11" fill="#64748b">Fisika Komputasi GLBB • Syarat Batas Benturan &amp; Berhenti Selamat</text>

  <!-- Node 1: Mulai -->
  <g filter="url(#shadow)">
    <rect x="295" y="80" width="170" height="36" rx="18" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="380" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Mulai</text>
  </g>
  <line x1="380" y1="116" x2="380" y2="136" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Node 2: Input Parameter -->
  <g filter="url(#shadow)">
    <polygon points="230,136 530,136 500,180 200,180" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="365" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">Input: v₀ (km/jam), m (kg), μ, d (m), Δt_airbag (s)</text>
    <text x="365" y="172" text-anchor="middle" font-size="10.5" fill="#0284c7">Konversi: v₀ = v₀ / 3.6 (m/s)</text>
  </g>
  <line x1="365" y1="180" x2="365" y2="202" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Node 3: Kondisi Awal -->
  <g filter="url(#shadow)">
    <rect x="235" y="202" width="260" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="365" y="220" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Inisialisasi Keadaan Awal:</text>
    <text x="365" y="235" text-anchor="middle" font-size="11" fill="#475569">t = 0 s,  x = 0 m,  v = v₀,  a = -μ·g</text>
  </g>
  <line x1="365" y1="244" x2="365" y2="268" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Node 4: Loop Integrasi Euler-Cromer -->
  <g filter="url(#shadow)">
    <rect x="205" y="268" width="320" height="58" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="365" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Integrasi Euler-Cromer (Loop Δt = 1/60 s):</text>
    <text x="365" y="304" text-anchor="middle" font-size="11" fill="#047857">1. vₙ₊₁ = max(0, vₙ - μ·g·Δt)   [Batas v ≥ 0]</text>
    <text x="365" y="318" text-anchor="middle" font-size="11" fill="#047857">2. xₙ₊₁ = xₙ + vₙ₊₁·Δt</text>
  </g>
  <line x1="365" y1="326" x2="365" y2="352" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Node 5: Decision 1 - Tabrakan (x >= d) -->
  <g filter="url(#shadow)">
    <polygon points="365,352 485,388 365,424 245,388" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="365" y="384" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">Apakah xₙ₊₁ ≥ d ?</text>
    <text x="365" y="398" text-anchor="middle" font-size="10" fill="#b91c1c">(Menabrak Barikade)</text>
  </g>

  <!-- Branch: YA (Crash - Left) -->
  <line x1="245" y1="388" x2="160" y2="388" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="160" y1="388" x2="160" y2="444" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="202" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Ya (s &gt; d)</text>

  <!-- Crash Action Box -->
  <g filter="url(#shadow)">
    <rect x="50" y="444" width="220" height="66" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="160" y="464" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">Tabrakan Terjadi:</text>
    <text x="160" y="480" text-anchor="middle" font-size="10.5" fill="#7f1d1d">v_impak = vₙ₊₁</text>
    <text x="160" y="496" text-anchor="middle" font-size="10.5" fill="#7f1d1d">F_peak = (π/2)·(m·v_impak / Δt)</text>
  </g>

  <!-- Branch: TIDAK (Check Safe Stop - Straight Down) -->
  <line x1="365" y1="424" x2="365" y2="452" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="382" y="438" font-size="11" font-weight="600" fill="#475569">Tidak</text>

  <!-- Node 6: Decision 2 - Berhenti (v == 0) -->
  <g filter="url(#shadow)">
    <polygon points="365,452 485,488 365,524 245,488" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="365" y="484" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">Apakah vₙ₊₁ == 0 ?</text>
    <text x="365" y="498" text-anchor="middle" font-size="10" fill="#047857">(Mobil Berhenti)</text>
  </g>

  <!-- Loop back from Decision 2 to Euler if Not Stopped -->
  <path d="M 485 488 L 560 488 L 560 297 L 525 297" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="575" y="390" font-size="10.5" font-weight="600" fill="#64748b">Tidak (Lanjut Loop)</text>

  <!-- Branch: YA (Safe Stop - Right/Bottom) -->
  <line x1="365" y1="524" x2="365" y2="546" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="385" y="538" font-size="11" font-weight="700" fill="#059669">Ya (s ≤ d)</text>

  <!-- Safe Stop Action Box -->
  <g filter="url(#shadow)">
    <rect x="255" y="546" width="220" height="52" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
    <text x="365" y="566" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">Berhenti Selamat:</text>
    <text x="365" y="583" text-anchor="middle" font-size="10.5" fill="#15803d">v = 0, Margin Aman: Δx = d - xₙ₊₁</text>
  </g>

  <!-- Lines to Done -->
  <line x1="160" y1="510" x2="160" y2="572" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="572" x2="255" y2="572" stroke="#94a3b8" stroke-width="1.5"/>

  <line x1="475" y1="572" x2="570" y2="572" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="570" y1="572" x2="570" y2="572" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Node 7: Selesai -->
  <g filter="url(#shadow)">
    <rect x="570" y="550" width="140" height="44" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="640" y="577" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Selesai / Catat</text>
  </g>
</svg>